[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "barney"
path = "src/main.rs"

[dependencies]
barney = { path = "../barney" }

clap = { version = "4.6.6", features = ["derive"] }
miette = { workspace = true, features = ["fancy"]}
tracing.workspace = true
tokio = { workspace = true, features = ["full"]}
indicatif = { workspace = true, features = ["tokio"] }
