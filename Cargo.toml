[workspace]
resolver = "3"

members = [
    "crates/bny_syntax",
    "crates/bny_schema",
    "barney",
]

[workspace.dependencies]
indextree = "4.9.2"
itertools = "0.15.0"
kdl = "6.5.0"
lasso = { version = "0.7.3", features = ["inline-more"] }
miette = { version = "7.6.0" }
thiserror = "2.0.20"
tracing = "0.1.44"
tokio = "1.53.1"
indicatif = "0.18.6"
